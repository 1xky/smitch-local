name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile desktop controller
        run: python -m py_compile desktop/smitch.py
      - name: Check launchers
        run: sh -n desktop/Start-Smitch.sh desktop/Start-Smitch.command
      - name: Test web interface bridge
        run: node android/tests/ui-test.cjs

